<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swelly — Surf & Beach Community</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ---------- TOP BAR ---------- */

    .topbar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: min(680px, calc(100% - 30px));
      display: flex;
      gap: 10px;
    }

    .logo {
      background: white;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 22px;
      font-weight: 800;
      color: #087f9f;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      white-space: nowrap;
    }

    .search-box {
      flex: 1;
      display: flex;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 16px;
      font-size: 15px;
      min-width: 0;
    }

    .search-box button {
      border: none;
      background: #087f9f;
      color: white;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .search-box button:hover {
      background: #066b86;
    }

    /* ---------- MAP BUTTON ---------- */

    .map-help {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: rgba(255,255,255,0.95);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
      text-align: center;
    }

    /* ---------- MODALS ---------- */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      width: min(500px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    }

    .modal h2 {
      margin-top: 0;
      color: #087f9f;
    }

    .modal input,
    .modal textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 15px;
      font-family: inherit;
    }

    .modal textarea {
      min-height: 90px;
      resize: vertical;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn {
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .primary-btn {
      background: #087f9f;
      color: white;
      flex: 1;
    }

    .primary-btn:hover {
      background: #066b86;
    }

    .secondary-btn {
      background: #e9eef0;
      color: #333;
    }

    .danger-btn {
      background: #d9534f;
      color: white;
    }

    .close-btn {
      float: right;
      border: none;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
      color: #777;
    }

    /* ---------- BEACH PAGE ---------- */

    .beach-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .beach-header h2 {
      margin: 0;
    }

    .report-card {
      border: 1px solid #e1e6e8;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 16px;
      background: #fafcfc;
    }

    .report-card img {
      width: 100%;
      max-height: 330px;
      object-fit: cover;
      display: block;
    }

    .report-info {
      padding: 13px;
    }

    .report-time {
      color: #777;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .report-comment {
      font-size: 14px;
      line-height: 1.45;
    }

    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #087f9f;
    }

    .status {
      font-size: 13px;
      margin-top: 8px;
      padding: 9px;
      border-radius: 8px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #ffe8e8;
      color: #a00000;
    }

    .status.success {
      background: #e7f8ed;
      color: #176b35;
    }

    .file-label {
      display: block;
      padding: 14px;
      border: 2px dashed #b7cbd0;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
      color: #087f9f;
      font-weight: 700;
    }

    .file-label:hover {
      background: #f2fafc;
    }

    #photoInput {
      display: none;
    }

    .coordinates {
      font-size: 12px;
      color: #777;
      margin-bottom: 15px;
    }

    /* Leaflet popup */

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .popup-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .popup-button {
      border: none;
      background: #087f9f;
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .topbar {
        top: 10px;
        width: calc(100% - 20px);
      }

      .logo {
        padding: 11px 12px;
        font-size: 19px;
      }

      .search-box input {
        padding: 12px;
      }

      .search-box button {
        padding: 0 13px;
      }
    }
  </style>
</head>

<body>

  <!-- MAP -->
  <div id="map"></div>

  <!-- SEARCH -->
  <div class="topbar">
    <div class="logo">🌊 Swelly</div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Search beaches, surf spots, cities..."
      >
      <button id="searchButton">Search</button>
    </div>
  </div>

  <div class="map-help">
    📍 Click anywhere on the map to add a beach or surf spot
  </div>

  <!-- ADD BEACH MODAL -->
  <div class="modal-overlay" id="addBeachModal">
    <div class="modal">

      <button class="close-btn" onclick="closeModal('addBeachModal')">
        ×
      </button>

      <h2>Add a Beach</h2>

      <p class="coordinates" id="selectedCoordinates"></p>

      <input
        id="beachNameInput"
        type="text"
        placeholder="Beach or surf spot name"
      >

      <div id="beachStatus" class="status"></div>

      <div class="button-row">
        <button
          class="secondary-btn"
          onclick="closeModal('addBeachModal')"
        >
          Cancel
        </button>

        <button
          class="primary-btn"
          id="createBeachButton"
        >
          Add Beach
        </button>
      </div>

    </div>
  </div>

  <!-- BEACH MODAL -->
  <div class="modal-overlay" id="beachModal">
    <div class="modal">

      <button class="close-btn" onclick="closeModal('beachModal')">
        ×
      </button>

      <div class="beach-header">
        <h2 id="beachTitle">Beach</h2>

        <button
          class="primary-btn"
          id="uploadFromBeachButton"
          style="flex:none;"
        >
          📸 Upload Photo
        </button>
      </div>

      <div id="reportsContainer">
        <div class="loading">
          Loading recent reports...
        </div>
      </div>

    </div>
  </div>

  <!-- UPLOAD PHOTO MODAL -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal">

      <button class="close-btn" onclick="closeModal('uploadModal')">
        ×
      </button>

      <h2>Upload a Beach Photo</h2>

      <p id="uploadBeachName"></p>

      <label class="file-label" for="photoInput">
        📷 Choose a photo
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

      <textarea
        id="commentInput"
        placeholder="What's the beach like right now? Waves, crowds, wind, conditions..."
      ></textarea>

      <div id="uploadStatus" class="status"></div>

      <div class="button-row">
        <button
          class="secondary-btn"
          onclick="closeModal('uploadModal')"
        >
          Cancel
        </button>

        <button
          class="primary-btn"
          id="uploadButton"
        >
          Upload
        </button>
      </div>

    </div>
  </div>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- LEAFLET -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* =========================================================
       SWELLY SUPABASE CONNECTION
       ========================================================= */

    const SUPABASE_URL =
      "https://xspkqgwtdrysvtaaeolq.supabase.co";

    /*
      PASTE YOUR SUPABASE PUBLISHABLE KEY BETWEEN THE QUOTES.
    */
    const SUPABASE_KEY =
      "sb_publishable_UOxZRBlJmfn9Tg4FiqHSTg_bako0ei_";

    const { createClient } =
      window.supabase;

    const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


    /* =========================================================
       MAP
       ========================================================= */

    const map = L.map("map", {
      worldCopyJump: true
    }).setView([20, 0], 2);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }
    ).addTo(map);


    /* =========================================================
       VARIABLES
       ========================================================= */

    let selectedLatitude = null;
    let selectedLongitude = null;

    let selectedBeach = null;

    const markers = {};


    /* =========================================================
       HELPERS
       ========================================================= */

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function closeModal(id) {
      document
        .getElementById(id)
        .classList
        .remove("active");
    }


    function openModal(id) {
      document
        .getElementById(id)
        .classList
        .add("active");
    }


    function showStatus(elementId, message, type) {
      const element =
        document.getElementById(elementId);

      element.textContent = message;

      element.className =
        "status show " + type;
    }


    function formatDate(dateString) {
      const date =
        new Date(dateString);

      return date.toLocaleString();
    }


    /* =========================================================
       LOAD BEACHES FROM SUPABASE
       ========================================================= */

    async function loadBeaches() {

      const {
        data,
        error
      } = await supabase
        .from("beaches")
        .select("*")
        .order("created_at", {
          ascending: true
        });

      if (error) {
        console.error("Beach loading error:", error);
        return;
      }

      data.forEach(addBeachMarker);
    }


    /* =========================================================
       ADD BEACH MARKER
       ========================================================= */

    function addBeachMarker(beach) {

      if (markers[beach.id]) {
        return;
      }

      const marker =
        L.marker([
          beach.latitude,
          beach.longitude
        ]).addTo(map);

      const popupHtml = `
        <div class="popup-title">
          ${escapeHtml(beach.name)}
        </div>

        <button
          class="popup-button"
          onclick="openBeach('${beach.id}')"
        >
          View Beach
        </button>
      `;

      marker.bindPopup(popupHtml);

      markers[beach.id] = marker;
    }


    /* =========================================================
       CLICK MAP TO ADD BEACH
       ========================================================= */

    map.on("click", function(event) {

      selectedLatitude =
        event.latlng.lat;

      selectedLongitude =
        event.latlng.lng;

      document.getElementById(
        "selectedCoordinates"
      ).textContent =
        `Location: ${selectedLatitude.toFixed(5)}, ${selectedLongitude.toFixed(5)}`;

      document.getElementById(
        "beachNameInput"
      ).value = "";

      document.getElementById(
        "beachStatus"
      ).className = "status";

      openModal("addBeachModal");
    });


    /* =========================================================
       CREATE BEACH
       ========================================================= */

    document
      .getElementById("createBeachButton")
      .addEventListener("click", async function() {

        const name =
          document
            .getElementById("beachNameInput")
            .value
            .trim();

        if (!name) {
          showStatus(
            "beachStatus",
            "Please enter a beach or surf spot name.",
            "error"
          );

          return;
        }

        if (
          selectedLatitude === null ||
          selectedLongitude === null
        ) {
          showStatus(
            "beachStatus",
            "Please choose a location on the map.",
            "error"
          );

          return;
        }

        this.disabled = true;
        this.textContent = "Adding...";

        const {
          data,
          error
        } = await supabase
          .from("beaches")
          .insert({
            name: name,
            latitude: selectedLatitude,
            longitude: selectedLongitude
          })
          .select()
          .single();

        if (error) {

          console.error(error);

          showStatus(
            "beachStatus",
            "Could not add the beach: " + error.message,
            "error"
          );

          this.disabled = false;
          this.textContent = "Add Beach";

          return;
        }

        addBeachMarker(data);

        closeModal("addBeachModal");

        map.setView(
          [
            data.latitude,
            data.longitude
          ],
          12
        );

        openBeach(data.id);

        this.disabled = false;
        this.textContent = "Add Beach";
      });


    /* =========================================================
       OPEN BEACH
       ========================================================= */

    async function openBeach(beachId) {

      const {
        data: beach,
        error
      } = await supabase
        .from("beaches")
        .select("*")
        .eq("id", beachId)
        .single();

      if (error) {

        console.error(error);

        alert(
          "Could not load this beach."
        );

        return;
      }

      selectedBeach = beach;

      document.getElementById(
        "beachTitle"
      ).textContent = beach.name;

      document.getElementById(
        "uploadBeachName"
      ).textContent =
        `Upload a recent photo from ${beach.name}. Photos and reports are shown for 72 hours.`;

      document.getElementById(
        "reportsContainer"
      ).innerHTML =
        `<div class="loading">Loading recent reports...</div>`;

      openModal("beachModal");

      await loadReports(beach.id);
    }


    /* =========================================================
       LOAD REPORTS
       ========================================================= */

    async function loadReports(beachId) {

      const now =
        new Date().toISOString();

      const {
        data,
        error
      } = await supabase
        .from("reports")
        .select("*")
        .eq("beach_id", beachId)
        .gt("expires_at", now)
        .order("created_at", {
          ascending: false
        });

      const container =
        document.getElementById(
          "reportsContainer"
        );

      if (error) {

        console.error(error);

        container.innerHTML = `
          <div class="status show error">
            Could not load reports.
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:40px;">🌊</div>
            <p>No recent reports yet.</p>
            <p>Be the first person to upload a photo.</p>
          </div>
        `;

        return;
      }

      container.innerHTML = "";

      data.forEach(report => {

        const card =
          document.createElement("div");

        card.className =
          "report-card";

        card.innerHTML = `
          <img
            src="${escapeHtml(report.photo_url)}"
            alt="Recent photo from ${escapeHtml(selectedBeach.name)}"
          >

          <div class="report-info">

            <div class="report-time">
              📅 ${formatDate(report.created_at)}
            </div>

            ${
              report.comment
                ? `<div class="report-comment">${escapeHtml(report.comment)}</div>`
                : ""
            }

          </div>
        `;

        container.appendChild(card);
      });
    }


    /* =========================================================
       OPEN UPLOAD MODAL
       ========================================================= */

    document
      .getElementById("uploadFromBeachButton")
      .addEventListener("click", function() {

        if (!selectedBeach) {
          return;
        }

        document.getElementById(
          "uploadBeachName"
        ).textContent =
          `Upload a recent photo from ${selectedBeach.name}. Photos and reports are shown for 72 hours.`;

        document.getElementById(
          "photoInput"
        ).value = "";

        document.getElementById(
          "commentInput"
        ).value = "";

        document.getElementById(
          "uploadStatus"
        ).className = "status";

        closeModal("beachModal");

        openModal("uploadModal");
      });


    /* =========================================================
       UPLOAD PHOTO
       ========================================================= */

    document
      .getElementById("uploadButton")
      .addEventListener("click", async function() {

        if (!selectedBeach) {

          showStatus(
            "uploadStatus",
            "No beach selected.",
            "error"
          );

          return;
        }

        const file =
          document.getElementById(
            "photoInput"
          ).files[0];

        const comment =
          document.getElementById(
            "commentInput"
          ).value.trim();

        if (!file) {

          showStatus(
            "uploadStatus",
            "Please choose a photo first.",
            "error"
          );

          return;
        }

        /*
          Keep uploads reasonably sized.
          This prevents enormous files from being uploaded.
        */

        if (file.size > 10 * 1024 * 1024) {

          showStatus(
            "uploadStatus",
            "Please choose a photo smaller than 10 MB.",
            "error"
          );

          return;
        }

        if (!file.type.startsWith("image/")) {

          showStatus(
            "uploadStatus",
            "Please choose an image file.",
            "error"
          );

          return;
        }

        this.disabled = true;
        this.textContent = "Uploading...";

        try {

          /*
            Create a unique filename.
          */

          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();

          const randomPart =
            crypto.randomUUID();

          const filePath =
            `${selectedBeach.id}/${randomPart}.${extension}`;


          /* ---------- UPLOAD IMAGE ---------- */

          const {
            error: uploadError
          } = await supabase
            .storage
            .from("swelly-photos")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false,
                contentType: file.type
              }
            );

          if (uploadError) {
            throw uploadError;
          }


          /* ---------- GET PUBLIC PHOTO URL ---------- */

          const {
            data: publicUrlData
          } = supabase
            .storage
            .from("swelly-photos")
            .getPublicUrl(filePath);

          const photoUrl =
            publicUrlData.publicUrl;


          /* ---------- 72 HOURS ---------- */

          const createdAt =
            new Date();

          const expiresAt =
            new Date(
              createdAt.getTime()
              + 72 * 60 * 60 * 1000
            );


          /* ---------- SAVE REPORT ---------- */

          const {
            error: reportError
          } = await supabase
            .from("reports")
            .insert({
              beach_id: selectedBeach.id,
              photo_url: photoUrl,
              comment: comment,
              created_at: createdAt.toISOString(),
              expires_at: expiresAt.toISOString()
            });

          if (reportError) {
            throw reportError;
          }


          /* ---------- SUCCESS ---------- */

          showStatus(
            "uploadStatus",
            "Photo uploaded successfully! Everyone can now see it.",
            "success"
          );

          this.disabled = false;
          this.textContent = "Upload";

          setTimeout(async function() {

            closeModal("uploadModal");

            await openBeach(
              selectedBeach.id
            );

          }, 1000);

        } catch (error) {

          console.error(
            "Upload error:",
            error
          );

          showStatus(
            "uploadStatus",
            "Upload failed: " + error.message,
            "error"
          );

          this.disabled = false;
          this.textContent = "Upload";
        }
      });


    /* =========================================================
       SEARCH
       ========================================================= */

    document
      .getElementById("searchButton")
      .addEventListener("click", searchLocation);

    document
      .getElementById("searchInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          searchLocation();
        }

      });


    async function searchLocation() {

      const query =
        document
          .getElementById("searchInput")
          .value
          .trim();

      if (!query) {
        return;
      }

      const button =
        document.getElementById(
          "searchButton"
        );

      button.disabled = true;
      button.textContent = "...";

      try {

        /*
          Search OpenStreetMap / Nominatim.
        */

        const url =
          "https://nominatim.openstreetmap.org/search" +
          "?format=json" +
          "&limit=1" +
          "&q=" +
          encodeURIComponent(query);

        const response =
          await fetch(url, {
            headers: {
              "Accept": "application/json"
            }
          });

        const results =
          await response.json();

        if (!results.length) {

          alert(
            "We couldn't find that location."
          );

          return;
        }

        const result =
          results[0];

        const latitude =
          parseFloat(result.lat);

        const longitude =
          parseFloat(result.lon);

        map.setView(
          [latitude, longitude],
          13
        );

      } catch (error) {

        console.error(error);

        alert(
          "Search failed. Please try again."
        );

      } finally {

        button.disabled = false;
        button.textContent = "Search";
      }
    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    async function initializeSwelly() {

      console.log(
        "Swelly starting..."
      );

      console.log(
        "Connecting to Supabase..."
      );

      await loadBeaches();

      console.log(
        "Swelly is ready."
      );
    }


    initializeSwelly();

  </script>

</body>
</html>
